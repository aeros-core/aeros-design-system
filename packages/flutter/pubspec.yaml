name: aeros_design_system
description: Aeros Design System — theme, tokens and widgets for Flutter apps.
version: 3.0.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    # The data face: IBM Plex Mono, static Regular + Medium (the only weights
    # the type scale uses; see assets/fonts/OFL-IBMPlexMono.txt). Bundled, so
    # there is no runtime font fetch and it renders in tests.
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
    # The wordmark face: Nunito Sans Expanded Medium, subset to "Aeros"
    # (see AerosWordmark + assets/fonts/OFL-NunitoSans.txt).
    - family: AerosWordmark
      fonts:
        - asset: assets/fonts/AerosWordmark-NunitoSansExpanded-Medium.ttf
          weight: 500
