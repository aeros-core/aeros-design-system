name: aeros_design_system
description: Aeros Design System — theme, tokens and widgets for Flutter apps.
version: 2.5.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    # The wordmark face: Nunito Sans Expanded Medium, subset to "Aeros"
    # (see AerosWordmark + assets/fonts/OFL-NunitoSans.txt).
    - family: AerosWordmark
      fonts:
        - asset: assets/fonts/AerosWordmark-NunitoSansExpanded-Medium.ttf
          weight: 500
