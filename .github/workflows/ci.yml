name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Build + contrast (tokens & react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens
      - run: pnpm build:react
      # The published bundle must keep the "use client" directive, or every
      # Radix-based component crashes in Next.js App Router server components.
      - name: Assert "use client" survives bundling
        run: |
          head -c 200 packages/react/dist/index.js | grep -q '"use client"' \
            || { echo '"use client" directive missing from dist/index.js'; exit 1; }
      # Generated Dart tokens must be committed fresh — build:tokens rewrites
      # packages/flutter/lib/src/tokens/aeros_tokens.g.dart.
      - name: Assert generated Dart tokens are committed
        run: git diff --exit-code packages/flutter/lib/src/tokens/aeros_tokens.g.dart
      - run: pnpm lint:react
      - run: pnpm test:react
      - run: pnpm check:contrast
      - run: pnpm check:hardcoded
      - run: pnpm check:flutter-drift
      - run: pnpm check:versions

  flutter:
    name: Analyze + test (flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: packages/flutter
        run: flutter pub get
      - working-directory: packages/flutter
        run: dart analyze lib
      - working-directory: packages/flutter
        run: flutter test
